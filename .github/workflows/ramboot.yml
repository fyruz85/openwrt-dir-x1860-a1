name: A1 experimental RAM-only compile
on:
  workflow_dispatch:
  push:
    branches: [experimental/ramboot]
    paths: ['port/**', 'scripts/**', '.github/workflows/ramboot.yml']
permissions:
  contents: read
jobs:
  compile:
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential clang flex bison g++ gawk gcc-multilib g++-multilib gettext git libncurses-dev libssl-dev python3 python3-setuptools rsync swig unzip zlib1g-dev file wget time xsltproc
      - name: Compile experimental image
        run: JOBS="$(nproc)" bash scripts/build-ramboot.sh
      - name: Archive compile candidate (not flashable)
        uses: actions/upload-artifact@v4
        with:
          name: EXPERIMENTAL-NOT-FOR-FLASH
          path: build/EXPERIMENTAL-NOT-FOR-FLASH/
          if-no-files-found: error
          retention-days: 7
